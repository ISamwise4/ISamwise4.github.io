<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <button class="toggle-btn" id="theme-toggle" title="Toggle Light/Dark Mode">Dark</button>
    <div class="page-wrap">
        <header>
            <h1>About Me</h1>
        </header>

        <section>
            <p>
                Yo what's up gamers, It's me Samwise!
            </p>
            <p>
                I try to make music and stuff, but I'm not very good at it yet. 
            </p>
            <p>
                On this website you can find some of my stuff.
            </p>
            <p>
                Here are a few things about me;
            </p>
        </section>

        <footer>
            <a class="btn" href="index.html">Home</a>
        </footer>
    </div>
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        
        // Load saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            toggleBtn.textContent = 'Light';
        } else {
            toggleBtn.textContent = 'Dark';
        }
        
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            toggleBtn.textContent = isLight ? 'Light' : 'Dark';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });
    </script>
</body>
</html>
